name: timeful-test

services:
  # The test stack uses postgres-test; do not publish the inherited development service.
  postgres:
    ports: !reset []

  mongo-test:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_test_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  postgres-test:
    image: postgres:18.6-bookworm@sha256:7d2695c3aa88e792e8b3b233e7e4adb296a20412c6c0ca361e3edaaacfada108
    restart: unless-stopped
    ports:
      - "${POSTGRES_BIND_HOST:?POSTGRES_BIND_HOST is required}:${POSTGRES_PORT:?POSTGRES_PORT is required}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_BOOTSTRAP_USERNAME:?POSTGRES_BOOTSTRAP_USERNAME is required}
      POSTGRES_PASSWORD: ${POSTGRES_BOOTSTRAP_PASSWORD:?POSTGRES_BOOTSTRAP_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DATABASE:?POSTGRES_DATABASE is required}
      POSTGRES_MIGRATOR_USERNAME: ${POSTGRES_MIGRATOR_USERNAME:?POSTGRES_MIGRATOR_USERNAME is required}
      POSTGRES_MIGRATOR_PASSWORD: ${POSTGRES_MIGRATOR_PASSWORD:?POSTGRES_MIGRATOR_PASSWORD is required}
      POSTGRES_APPLICATION_USERNAME: ${POSTGRES_APPLICATION_USERNAME:?POSTGRES_APPLICATION_USERNAME is required}
      POSTGRES_APPLICATION_PASSWORD: ${POSTGRES_APPLICATION_PASSWORD:?POSTGRES_APPLICATION_PASSWORD is required}
      POSTGRES_BACKUP_USERNAME: ${POSTGRES_BACKUP_USERNAME:?POSTGRES_BACKUP_USERNAME is required}
      POSTGRES_BACKUP_PASSWORD: ${POSTGRES_BACKUP_PASSWORD:?POSTGRES_BACKUP_PASSWORD is required}
    volumes:
      - postgres_test_data:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username \"$$POSTGRES_USER\" --dbname \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  postgres-test-bootstrap:
    image: postgres:18.6-bookworm@sha256:7d2695c3aa88e792e8b3b233e7e4adb296a20412c6c0ca361e3edaaacfada108
    restart: "no"
    environment:
      PGPASSWORD: ${POSTGRES_BOOTSTRAP_PASSWORD:?POSTGRES_BOOTSTRAP_PASSWORD is required}
      POSTGRES_USER: ${POSTGRES_BOOTSTRAP_USERNAME:?POSTGRES_BOOTSTRAP_USERNAME is required}
      POSTGRES_TEST_DATABASE: ${POSTGRES_TEST_DATABASE:?POSTGRES_TEST_DATABASE is required}
      POSTGRES_MIGRATOR_USERNAME: ${POSTGRES_MIGRATOR_USERNAME:?POSTGRES_MIGRATOR_USERNAME is required}
      POSTGRES_APPLICATION_USERNAME: ${POSTGRES_APPLICATION_USERNAME:?POSTGRES_APPLICATION_USERNAME is required}
      POSTGRES_BACKUP_USERNAME: ${POSTGRES_BACKUP_USERNAME:?POSTGRES_BACKUP_USERNAME is required}
    depends_on:
      postgres-test:
        condition: service_healthy
    command:
      [
        "sh",
        "-ec",
        "printf '%s\\n' \"SELECT format('CREATE DATABASE %I', :'database_name') WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = :'database_name') \\gexec\" \"GRANT CONNECT ON DATABASE :\\\"database_name\\\" TO :\\\"migrator_username\\\", :\\\"application_username\\\", :\\\"backup_username\\\";\" | psql --host postgres-test --username \"$$POSTGRES_USER\" --dbname postgres --set=ON_ERROR_STOP=1 --set=database_name=\"$$POSTGRES_TEST_DATABASE\" --set=migrator_username=\"$$POSTGRES_MIGRATOR_USERNAME\" --set=application_username=\"$$POSTGRES_APPLICATION_USERNAME\" --set=backup_username=\"$$POSTGRES_BACKUP_USERNAME\" && printf 'GRANT USAGE, CREATE ON SCHEMA public TO :\"migrator_username\";\\n' | psql --host postgres-test --username \"$$POSTGRES_USER\" --dbname \"$$POSTGRES_TEST_DATABASE\" --set=ON_ERROR_STOP=1 --set=migrator_username=\"$$POSTGRES_MIGRATOR_USERNAME\"",
      ]

  postgres-test-migrate:
    build:
      context: ./server
      target: migrator
    restart: "no"
    environment:
      POSTGRES_MIGRATOR_URI: postgres://${POSTGRES_MIGRATOR_USERNAME:?POSTGRES_MIGRATOR_USERNAME is required}:${POSTGRES_MIGRATOR_PASSWORD:?POSTGRES_MIGRATOR_PASSWORD is required}@postgres-test:5432/${POSTGRES_TEST_DATABASE:?POSTGRES_TEST_DATABASE is required}?sslmode=disable
      POSTGRES_APPLICATION_USERNAME: ${POSTGRES_APPLICATION_USERNAME:?POSTGRES_APPLICATION_USERNAME is required}
    depends_on:
      postgres-test-bootstrap:
        condition: service_completed_successfully
    command:
      [
        "sh",
        "-ec",
        "goose -dir /migrations postgres \"$$POSTGRES_MIGRATOR_URI\" up && printf '%s\\n' 'GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO :\"application_username\";' 'ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO :\"application_username\";' | psql \"$$POSTGRES_MIGRATOR_URI\" --set=ON_ERROR_STOP=1 --set=application_username=\"$$POSTGRES_APPLICATION_USERNAME\"",
      ]

  server-test:
    extends:
      file: compose.yaml
      service: server
    build:
      target: testbase
    working_dir: /app
    environment:
      POSTGRES_APPLICATION_URI: postgres://${POSTGRES_APPLICATION_USERNAME:?POSTGRES_APPLICATION_USERNAME is required}:${POSTGRES_APPLICATION_PASSWORD:?POSTGRES_APPLICATION_PASSWORD is required}@postgres-test:5432/${POSTGRES_TEST_DATABASE:?POSTGRES_TEST_DATABASE is required}?sslmode=disable
      APP_PORT: ${E2E_API_INTERNAL_PORT:?E2E_API_INTERNAL_PORT is required}
      GOCACHE: /go-build-cache
      GOMODCACHE: /go/pkg/mod
    ports: !override
      - "${E2E_API_HOST:?E2E_API_HOST is required}:${E2E_API_PORT:?E2E_API_PORT is required}:${E2E_API_INTERNAL_PORT:?E2E_API_INTERNAL_PORT is required}"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:${E2E_API_INTERNAL_PORT:?E2E_API_INTERNAL_PORT is required}/api/health"]
    restart: "no"
    volumes: !override
      - ./server:/app
      - go_build_cache:/go-build-cache
      - go_mod_cache:/go/pkg/mod
    depends_on: !override
      mongo-test:
        condition: service_healthy
      postgres-test-migrate:
        condition: service_completed_successfully
    command: ["go", "run", "."]

  server-route-test:
    build:
      context: ./server
      target: testbase
    working_dir: /app
    environment:
      GOCACHE: /go-build-cache
      GOMODCACHE: /go/pkg/mod
      MONGODB_URI: ${MONGODB_URI:?MONGODB_URI is required}
      MONGODB_DATABASE: ${MONGODB_DATABASE:?MONGODB_DATABASE is required}
      POSTGRES_APPLICATION_URI: postgres://${POSTGRES_APPLICATION_USERNAME:?POSTGRES_APPLICATION_USERNAME is required}:${POSTGRES_APPLICATION_PASSWORD:?POSTGRES_APPLICATION_PASSWORD is required}@postgres-test:5432/${POSTGRES_TEST_DATABASE:?POSTGRES_TEST_DATABASE is required}?sslmode=disable
      ROUTES_READ_FILTERS_TEST_MODE: "compose"
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
    volumes:
      - ./server:/app
      - go_build_cache:/go-build-cache
      - go_mod_cache:/go/pkg/mod
    command:
      [
        "go",
        "test",
        "./...",
        "-count=1",
      ]
    depends_on:
      mongo-test:
        condition: service_healthy
      postgres-test-migrate:
        condition: service_completed_successfully

volumes:
  mongo_test_data:
  postgres_test_data:
  # Persistent Go compile and module caches shared by server-test and
  # server-route-test so `go run` / `go test` compile incrementally instead of
  # from cold on every container start. External so `down -v` retains them;
  # remove them with `docker volume rm timeful-test-go-build-cache
  # timeful-test-go-mod-cache` to reset. Compose never creates external
  # volumes; CI seeds them via actions/cache and the E2E stack manager
  # (e2e/isolated-test-stack.ts) creates them locally.
  go_build_cache:
    external: true
    name: timeful-test-go-build-cache
  go_mod_cache:
    external: true
    name: timeful-test-go-mod-cache

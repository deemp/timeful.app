name: timeful-development

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  postgres:
    image: postgres:18.6-bookworm@sha256:7d2695c3aa88e792e8b3b233e7e4adb296a20412c6c0ca361e3edaaacfada108
    restart: unless-stopped
    ports:
      - "${POSTGRES_BIND_HOST:?POSTGRES_BIND_HOST is required}:${POSTGRES_PORT:?POSTGRES_PORT is required}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_BOOTSTRAP_USERNAME:?POSTGRES_BOOTSTRAP_USERNAME is required}
      POSTGRES_PASSWORD: ${POSTGRES_BOOTSTRAP_PASSWORD:?POSTGRES_BOOTSTRAP_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DATABASE:?POSTGRES_DATABASE is required}
      POSTGRES_MIGRATOR_USERNAME: ${POSTGRES_MIGRATOR_USERNAME:?POSTGRES_MIGRATOR_USERNAME is required}
      POSTGRES_MIGRATOR_PASSWORD: ${POSTGRES_MIGRATOR_PASSWORD:?POSTGRES_MIGRATOR_PASSWORD is required}
      POSTGRES_APPLICATION_USERNAME: ${POSTGRES_APPLICATION_USERNAME:?POSTGRES_APPLICATION_USERNAME is required}
      POSTGRES_APPLICATION_PASSWORD: ${POSTGRES_APPLICATION_PASSWORD:?POSTGRES_APPLICATION_PASSWORD is required}
      POSTGRES_BACKUP_USERNAME: ${POSTGRES_BACKUP_USERNAME:?POSTGRES_BACKUP_USERNAME is required}
      POSTGRES_BACKUP_PASSWORD: ${POSTGRES_BACKUP_PASSWORD:?POSTGRES_BACKUP_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username \"$$POSTGRES_USER\" --dbname \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  postgres-migrate:
    build:
      context: ./server
      target: migrator
    restart: "no"
    environment:
      POSTGRES_MIGRATOR_URI: ${POSTGRES_MIGRATOR_URI:?POSTGRES_MIGRATOR_URI is required}
      POSTGRES_APPLICATION_USERNAME: ${POSTGRES_APPLICATION_USERNAME:?POSTGRES_APPLICATION_USERNAME is required}
    depends_on:
      postgres:
        condition: service_healthy
    command:
      [
        "sh",
        "-ec",
        "goose -dir /migrations postgres \"$$POSTGRES_MIGRATOR_URI\" up && printf '%s\\n' 'GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO :\"application_username\";' 'ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO :\"application_username\";' | psql \"$$POSTGRES_MIGRATOR_URI\" --set=ON_ERROR_STOP=1 --set=application_username=\"$$POSTGRES_APPLICATION_USERNAME\"",
      ]

  frontend-artifacts:
    build:
      context: ./frontend
      target: builder
      args:
        VITE_APP_ENV: ${VITE_APP_ENV:?VITE_APP_ENV is required}
        VITE_POSTHOG_API_KEY: ${VITE_POSTHOG_API_KEY?VITE_POSTHOG_API_KEY must be declared}
        VITE_POSTHOG_API_HOST: ${VITE_POSTHOG_API_HOST?VITE_POSTHOG_API_HOST must be declared}
        VITE_GOOGLE_CLIENT_ID: ${CLIENT_ID?CLIENT_ID must be declared}
        VITE_MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID?MICROSOFT_CLIENT_ID must be declared}
        VITE_ENABLE_SIGN_IN: ${VITE_ENABLE_SIGN_IN:?VITE_ENABLE_SIGN_IN is required}
        VITE_ENABLE_RICH_LANDING: ${VITE_ENABLE_RICH_LANDING:?VITE_ENABLE_RICH_LANDING is required}
        VITE_ENABLE_PRIVACY_POLICY: ${VITE_ENABLE_PRIVACY_POLICY:?VITE_ENABLE_PRIVACY_POLICY is required}
        VITE_FEEDBACK_URL: ${VITE_FEEDBACK_URL:?VITE_FEEDBACK_URL is required}
        VITE_SUPPORT_EMAIL: ${VITE_SUPPORT_EMAIL?VITE_SUPPORT_EMAIL must be declared}
        VITE_GITHUB_REPO_URL: ${VITE_GITHUB_REPO_URL:?VITE_GITHUB_REPO_URL is required}
    volumes:
      - frontend_dist:/app/dist
    command:
      [
        "sh",
        "-c",
        "find /app/dist -mindepth 1 -maxdepth 1 -exec rm -rf {} + && cp -a /build/. /app/dist/ && test -f /app/dist/index.html && echo 'Frontend artifacts copied'",
      ]

  server:
    build:
      context: ./server
    restart: unless-stopped
    # The selected app env controls the server's host binding and listener port.
    ports:
      - "${SERVER_BIND_HOST:?SERVER_BIND_HOST is required}:${APP_PORT:?APP_PORT is required}:${APP_PORT:?APP_PORT is required}"
    environment:
      APP_ENV: ${APP_ENV:?APP_ENV is required}
      APP_PORT: ${APP_PORT:?APP_PORT is required}
      APP_BASE_URL: ${APP_BASE_URL:?APP_BASE_URL is required}
      ANALYTICS_PASSWORD: ${ANALYTICS_PASSWORD?ANALYTICS_PASSWORD must be declared}
      ANALYTICS_USERNAME: ${ANALYTICS_USERNAME?ANALYTICS_USERNAME must be declared}
      ANDROID_CLIENT_ID: ${ANDROID_CLIENT_ID?ANDROID_CLIENT_ID must be declared}
      CLIENT_ID: ${CLIENT_ID?CLIENT_ID must be declared}
      CLIENT_SECRET: ${CLIENT_SECRET?CLIENT_SECRET must be declared}
      CORS_ORIGINS: ${CORS_ORIGINS?CORS_ORIGINS must be declared}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN?DISCORD_BOT_TOKEN must be declared}
      DISCORD_BOT_CHANNEL: ${DISCORD_BOT_CHANNEL?DISCORD_BOT_CHANNEL must be declared}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY?ENCRYPTION_KEY must be declared}
      FRONTEND_DIST: /app/frontend/dist
      GIN_MODE: ${GIN_MODE:?GIN_MODE is required}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD?GMAIL_APP_PASSWORD must be declared}
      GUILD_ID: ${GUILD_ID?GUILD_ID must be declared}
      IOS_CLIENT_ID: ${IOS_CLIENT_ID?IOS_CLIENT_ID must be declared}
      GOOGLE_CLOUD_PROJECT_ID: ${GOOGLE_CLOUD_PROJECT_ID:?GOOGLE_CLOUD_PROJECT_ID is required}
      GOOGLE_CLOUD_TASKS_LOCATION: ${GOOGLE_CLOUD_TASKS_LOCATION:?GOOGLE_CLOUD_TASKS_LOCATION is required}
      GOOGLE_CLOUD_TASKS_QUEUE: ${GOOGLE_CLOUD_TASKS_QUEUE:?GOOGLE_CLOUD_TASKS_QUEUE is required}
      LISTMONK_ENABLED: ${LISTMONK_ENABLED?LISTMONK_ENABLED must be declared}
      LISTMONK_FINAL_EMAIL_REMINDER_ID: ${LISTMONK_FINAL_EMAIL_REMINDER_ID?LISTMONK_FINAL_EMAIL_REMINDER_ID must be declared}
      LISTMONK_INITIAL_EMAIL_REMINDER_ID: ${LISTMONK_INITIAL_EMAIL_REMINDER_ID?LISTMONK_INITIAL_EMAIL_REMINDER_ID must be declared}
      LISTMONK_LIST_ID: ${LISTMONK_LIST_ID?LISTMONK_LIST_ID must be declared}
      LISTMONK_OTP_EMAIL_TEMPLATE_ID: ${LISTMONK_OTP_EMAIL_TEMPLATE_ID?LISTMONK_OTP_EMAIL_TEMPLATE_ID must be declared}
      LISTMONK_OTP_FROM_ADDRESS: ${LISTMONK_OTP_FROM_ADDRESS?LISTMONK_OTP_FROM_ADDRESS must be declared}
      LISTMONK_PASSWORD: ${LISTMONK_PASSWORD?LISTMONK_PASSWORD must be declared}
      LISTMONK_SECOND_EMAIL_REMINDER_ID: ${LISTMONK_SECOND_EMAIL_REMINDER_ID?LISTMONK_SECOND_EMAIL_REMINDER_ID must be declared}
      LISTMONK_URL: ${LISTMONK_URL?LISTMONK_URL must be declared}
      LISTMONK_USERNAME: ${LISTMONK_USERNAME?LISTMONK_USERNAME must be declared}
      MAILCHIMP_API_KEY: ${MAILCHIMP_API_KEY?MAILCHIMP_API_KEY must be declared}
      MAILJET_API_KEY: ${MAILJET_API_KEY?MAILJET_API_KEY must be declared}
      MAILJET_API_SECRET: ${MAILJET_API_SECRET?MAILJET_API_SECRET must be declared}
      MAILJET_LIST_ID: ${MAILJET_LIST_ID?MAILJET_LIST_ID must be declared}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID?MICROSOFT_CLIENT_ID must be declared}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET?MICROSOFT_CLIENT_SECRET must be declared}
      MONGODB_DATABASE: ${MONGODB_DATABASE:?MONGODB_DATABASE is required}
      MONGODB_URI: ${MONGODB_URI:?MONGODB_URI is required}
      POSTGRES_APPLICATION_URI: ${POSTGRES_APPLICATION_URI:?POSTGRES_APPLICATION_URI is required}
      POSTGRES_ANONYMOUS_EVENT_CREATION_ENABLED: ${POSTGRES_ANONYMOUS_EVENT_CREATION_ENABLED:?POSTGRES_ANONYMOUS_EVENT_CREATION_ENABLED is required}
      POSTGRES_CONNECT_TIMEOUT_SECONDS: ${POSTGRES_CONNECT_TIMEOUT_SECONDS:?POSTGRES_CONNECT_TIMEOUT_SECONDS is required}
      POSTGRES_MAX_CONNS: ${POSTGRES_MAX_CONNS:?POSTGRES_MAX_CONNS is required}
      TIMEFUL_EMAIL_ADDRESS: ${TIMEFUL_EMAIL_ADDRESS?TIMEFUL_EMAIL_ADDRESS must be declared}
      SERVICE_ACCOUNT_KEY_PATH: ${SERVICE_ACCOUNT_KEY_PATH?SERVICE_ACCOUNT_KEY_PATH must be declared}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      SLACK_DEV_WEBHOOK_URL: ${SLACK_DEV_WEBHOOK_URL?SLACK_DEV_WEBHOOK_URL must be declared}
      SLACK_PROD_WEBHOOK_URL: ${SLACK_PROD_WEBHOOK_URL?SLACK_PROD_WEBHOOK_URL must be declared}
    volumes:
      - frontend_dist:/app/frontend/dist:ro
      - server_logs:/app/logs
    depends_on:
      mongo:
        condition: service_healthy
      postgres-migrate:
        condition: service_completed_successfully
      frontend-artifacts:
        condition: service_completed_successfully
    # Probe the listener selected by APP_PORT.
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:${APP_PORT:?APP_PORT is required}/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  mongo_data:
  postgres_data:
  frontend_dist:
  server_logs:
